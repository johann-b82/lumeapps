services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    # APScheduler runs in-process with an in-memory jobstore — `--workers 1`
    # is mandatory. N workers would run every scheduled job N times (duplicate
    # Personio sync, duplicate sensor_poll ⇒ duplicate UDP/161 traffic + DB
    # constraint contention on UNIQUE(sensor_id, recorded_at)). See SEN-SCH-05
    # and PITFALLS C-7. If horizontal scaling is ever required, extract the
    # scheduler into its own container first (see ops runbook).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload
    env_file: .env
    environment:
      # D-04: HS256 signing key for signage device JWTs. Separate trust domain
      # from DIRECTUS_SECRET. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      SIGNAGE_DEVICE_JWT_SECRET: ${SIGNAGE_DEVICE_JWT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Player bundle (Phase 47-04): FastAPI mounts /player/* from the built
      # Vite player entry. Read-only so container can't mutate build output.
      - ./frontend/dist:/app/frontend/dist:ro
      # Directus owns the uploads volume (rw on directus service, ro here).
      # FastAPI reads media files by path resolved from signage_media.uri (Directus asset UUID) — SGN-INF-02.
      - ./directus_uploads:/directus/uploads:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      directus-bootstrap-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # Bind-mounted node_modules starts empty on fresh checkouts — install if
    # vite binary is missing, then run dev server. Idempotent on warm boots.
    command: sh -c "[ -x node_modules/.bin/vite ] || npm install --legacy-peer-deps; npm run dev"
    volumes:
      - ./frontend:/app
      - ./frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  directus:
    image: directus/directus:11.17.2
    env_file: .env
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - ./directus_uploads:/directus/uploads
      - ./directus_extensions:/directus/extensions
      - ./directus_database:/directus/database
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # --- Core secrets (from .env) ---
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      # --- Database connection — reuse existing `db` service ---
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Hide Alembic-managed app tables from Directus Data Model UI ---
      # v1.22 D-04 / SCHEMA-04: Minimal "never expose" superset.
      # Removed: sales_records, personio_employees, signage_devices and other
      # signage tables — these are now registered as v1.22 Directus collections
      # and must be visible to Directus metadata. Added: signage_heartbeat_event
      # (append-only analytics log, not an admin-editable collection).
      # upload_batches exposed as of v1.23 C-1 (read-only Admin + Viewer via Directus).
      # Comma-separated, no spaces (per Directus docs).
      # IMPORTANT: changing this env requires `docker compose up -d directus`
      # (not `docker compose restart directus`) to take effect.
      # See docs/operator-runbook.md section "DB_EXCLUDE_TABLES requires up -d".
      DB_EXCLUDE_TABLES: alembic_version,app_settings,personio_attendance,personio_absences,personio_sync_meta,sensors,sensor_readings,sensor_poll_log,signage_pairing_sessions,signage_heartbeat_event

      # --- First-Admin bootstrap (D-01); ignored on subsequent boots ---
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      # --- Public URL for email/oauth redirects (operator-only for v1.11) ---
      PUBLIC_URL: http://127.0.0.1:8055

      # Phase 64 D-04: CORS env removed entirely. The admin SPA reaches Directus
      # same-origin via Caddy's /directus/* route (prefix stripped), so no
      # cross-origin preflight happens on normal flows. If a direct-to-Directus
      # call ever reappears, CORS will fail loudly rather than silently allowing
      # an arbitrary origin.
      TELEMETRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot on a cold CI runner runs Directus's Knex migrations against
      # the empty `acm_kpi` database; on small GitHub runners that can take
      # 60-90s. Keep start_period generous so `compose up --wait` doesn't
      # short-circuit before the migrations finish.
      start_period: 120s

  directus-schema-apply:
    # One-shot service that registers Directus collection metadata for the
    # tables Alembic owns. Wrapped in apply-snapshot-idempotent.sh so warm-DB
    # restarts succeed: when `directus schema apply` hits the #25760
    # "Collection already exists" failure, the wrapper falls back to a REST
    # PATCH /collections/{name} loop (the same recipe documented in
    # docs/operator-runbook.md § 13). Runs AFTER directus is healthy and
    # BEFORE directus-bootstrap-roles so permission rows can reference the
    # registered collections.
    image: directus/directus:11.17.2
    env_file: .env
    environment:
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      SNAPSHOT_FILE: /snapshots/v1.22.yaml
    volumes:
      - ./directus/snapshots:/snapshots:ro
      - ./directus/apply-snapshot-idempotent.sh:/apply-snapshot-idempotent.sh:ro
      - ./directus/apply-snapshot-fallback.mjs:/apply-snapshot-fallback.mjs:ro
    tmpfs:
      # Override directus image's VOLUME declarations so Docker doesn't create
      # anonymous volumes on each run. This service only applies a schema and
      # exits — it never writes uploads/extensions/database files.
      - /directus/uploads
      - /directus/extensions
      - /directus/database
    depends_on:
      directus:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/apply-snapshot-idempotent.sh"]
    restart: "no"

  directus-bootstrap-roles:
    # Roles-as-code sidecar. Replaces the v10-style snapshot.yml approach
    # (rejected by Directus 11 — policies/access model). Runs a REST-API
    # bootstrap script that is idempotent (GET-before-POST).
    #
    # NOTE: viewer permission rows are NOT created here. Directus 11.17 has a
    # bootstrap-time bug where even a session JWT with admin_access:true is
    # rejected by /permissions writes (403 FORBIDDEN). They are inserted via
    # SQL by directus-bootstrap-permissions instead. See bootstrap-permissions.sql.
    image: curlimages/curl:8.10.1
    env_file: .env
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
    volumes:
      - ./directus/bootstrap-roles.sh:/bootstrap-roles.sh:ro
    depends_on:
      directus:
        condition: service_healthy
      directus-schema-apply:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/bootstrap-roles.sh"]
    restart: "no"

  directus-bootstrap-permissions:
    # Inserts Viewer permission rows directly into directus_permissions via
    # psql. SQL-based fallback for the Directus 11.17 bootstrap bug where
    # POST /permissions returns 403 even for an admin_access:true session.
    # Idempotent (ON CONFLICT DO NOTHING).
    image: postgres:17-alpine
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./directus/bootstrap-permissions.sql:/bootstrap-permissions.sql:ro
    tmpfs:
      # Override postgres image's VOLUME so no anon vol is created — this
      # container is a transient psql client, not a database.
      - /var/lib/postgresql/data
    depends_on:
      directus-bootstrap-roles:
        condition: service_completed_successfully
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap-permissions.sql"]
    restart: "no"

  caddy:
    # Phase 64 D-01: Caddy 2 alpine — reverse proxy fronting the full stack on :80.
    # HTTP only (D-02). TLS + external domain handling is out of scope.
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      directus:
        condition: service_healthy
    healthcheck:
      # Caddy returns 200 on / (proxied to frontend). If frontend is up, Caddy is serving.
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=3", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    container_name: kpi-backup
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Europe/Berlin
    volumes:
      - ./backups:/backups
      - ./backup/entrypoint.sh:/entrypoint.sh:ro
      - ./backup/dump.sh:/usr/local/bin/dump.sh:ro
    tmpfs:
      # Override postgres image's VOLUME so no anon vol is created — this
      # container only runs pg_dump against the `db` service.
      - /var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Paperless-ngx — document management. Mounted at /paperless via Caddy.
  # Auth is delegated to Directus through Caddy `forward_auth` (see Caddyfile)
  # and Paperless's `PAPERLESS_ENABLE_HTTP_REMOTE_USER`. Local Paperless users
  # are auto-provisioned on first hit matching the X-Remote-User header.
  # ---------------------------------------------------------------------------
  paperless-broker:
    image: redis:7-alpine
    restart: unless-stopped
    tmpfs:
      # Redis VOLUME at /data — we don't need persistent broker state.
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      paperless-broker:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./paperless_data:/usr/src/paperless/data
      - ./paperless_media:/usr/src/paperless/media
      - ./paperless_consume:/usr/src/paperless/consume
      - ./paperless_export:/usr/src/paperless/export
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      # Postgres backend — separate database `paperless` in the shared
      # `db` service. Reuses POSTGRES_USER/PASSWORD from .env.
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}

      # Subpath deployment: app served from /paperless/* via Caddy.
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost}
      PAPERLESS_FORCE_SCRIPT_NAME: /paperless
      PAPERLESS_STATIC_URL: /paperless/static/
      PAPERLESS_LOGOUT_REDIRECT_URL: /

      # SSO: trust X-Remote-User from Caddy. Caddy only sets this header
      # after a successful forward_auth call to /api/auth/forward, so any
      # request reaching Paperless with the header is already authenticated.
      # Django converts X-Remote-User -> HTTP_X_REMOTE_USER on the WSGI side.
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_X_REMOTE_USER

      # Paperless requires an admin on first start; we let it create one.
      # Subsequent users are auto-provisioned on first SSO hit.
      PAPERLESS_ADMIN_USER: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      PAPERLESS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      # OCR + locale defaults; safe to override per deployment.
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "5", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Stirling-PDF — PDF manipulation toolbox. Mounted at /pdf via Caddy.
  # Internal auth disabled (DOCKER_ENABLE_SECURITY=false); access is gated by
  # Caddy `forward_auth` against the same /api/auth/forward endpoint that
  # protects /paperless. Stirling has no concept of users, so X-Remote-User
  # is dropped on the floor — gate is purely a "valid Directus session
  # exists" check at the edge.
  #
  # No published port; only the Caddy network reaches stirling:8080.
  # ---------------------------------------------------------------------------
  stirling:
    image: stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    environment:
      # Subpath deployment: Spring Boot context path puts the whole app
      # behind /pdf so Caddy can `handle /pdf/*` and reverse_proxy
      # without prefix stripping.
      SERVER_SERVLET_CONTEXT_PATH: /pdf
      # No internal login screen; Caddy forward_auth is the gate.
      DOCKER_ENABLE_SECURITY: "false"
      # UI locale defaults; users can switch in-app.
      LANGS: en_GB,de_DE
      SYSTEM_DEFAULTLOCALE: de_DE
      # Skip heavy Calibre + LibreOffice book/HTML pipelines we don't use,
      # keeps the image lean. Flip to true if eBook conversion is needed.
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
    volumes:
      - ./stirling_data/configs:/configs
      - ./stirling_data/custom-files:/customFiles
      - ./stirling_data/logs:/logs
      - ./stirling_data/pipeline:/pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://localhost:8080/pdf/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # OpenProject (community) — project management. Mounted at /op via Caddy.
  # Edge-gated by Caddy forward_auth (Directus session must be valid to reach
  # the OpenProject login). OpenProject still maintains its own user accounts
  # internally because community edition does not support header-based SSO
  # (Enterprise-only). On first boot a single admin user is seeded; further
  # users are created in the OpenProject admin UI. Future SSO upgrade path
  # would slot an OIDC bridge (e.g. Authentik) between Directus and OP and
  # enable OmniAuth-OIDC on this service.
  #
  # Postgres backend: dedicated `openproject` database in the shared `db`
  # service. Reuses POSTGRES_USER / POSTGRES_PASSWORD.
  # ---------------------------------------------------------------------------
  openproject:
    image: openproject/openproject:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # All OpenProject env vars use the OPENPROJECT_ prefix and convert
      # `_` -> dot, `__` -> underscore in the canonical key path.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/openproject
      # Subpath: serve under /op so Caddy can `handle /op/*` without
      # prefix stripping. OpenProject builds asset URLs with this prefix.
      OPENPROJECT_RAILS__RELATIVE__URL__ROOT: /op
      OPENPROJECT_HOST__NAME: localhost
      # Behind Caddy on port 80 — no TLS at this layer.
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: de
      # Skip first-run wizard — let it boot straight to login.
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD: ${OPENPROJECT_ADMIN_PASSWORD:-OpenProjectAdmin1!}
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: "false"
      # In-memory cache is fine for a single-instance deployment.
      OPENPROJECT_CACHE__MEMCACHE__SERVER: ""
    volumes:
      - ./openproject_data/assets:/var/openproject/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://localhost:8080/op/health_checks/default || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
